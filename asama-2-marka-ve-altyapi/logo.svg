<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 200" role="img" aria-label="Kalbine Sor logosu">
  <!-- Uygulama ikonu: gül zemin, kalp-konuşma balonu -->
  <rect x="20" y="20" width="160" height="160" rx="36" fill="#B3446C"/>
  <!-- Kalp gövdesi -->
  <path d="M100 152
           C 96 148, 52 116, 46 86
           C 42 64, 56 48, 76 48
           C 88 48, 97 55, 100 62
           C 103 55, 112 48, 124 48
           C 144 48, 158 64, 154 86
           C 148 116, 104 148, 100 152 Z"
        fill="#FAF5F0"/>
  <!-- Konuşma balonu kuyruğu (kalbin ucundan) -->
  <path d="M100 152 L 88 170 L 106 156 Z" fill="#FAF5F0"/>
  <!-- Kalbin içinde üç nokta: 'yazıyor...' -->
  <circle cx="78" cy="92" r="7" fill="#B3446C"/>
  <circle cx="100" cy="92" r="7" fill="#B3446C"/>
  <circle cx="122" cy="92" r="7" fill="#B3446C"/>

  <!-- Wordmark -->
  <text x="212" y="118" font-family="Fraunces, Georgia, 'Times New Roman', serif" font-size="58" font-weight="600" fill="#3B1F33">kalbine sor</text>
  <text x="215" y="152" font-family="'Nunito Sans', -apple-system, Arial, sans-serif" font-size="19" letter-spacing="3" fill="#B3446C">AI İLİŞKİ KOÇUN</text>
</svg>
